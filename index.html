  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "seusomelier",
    "url": "https://www.seusomelier.com.br/",
    "description": "seusomelier.",
    "inLanguage": "pt-BR"
  }
  </script>

  <link rel="icon" type="image/jpeg" href="img/taylor.jpg" />
  <title>@seusomelier</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=VT323&display=swap");

    :root {
      --bg: #881E1E;
      --text: #251519;
      --border: rgba(37, 21, 25, 0.92);
      --card: rgba(190, 126, 126, 0.20);
      --card-hover: rgba(230, 174, 174, 0.30);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--text);
      font-family: "Space Mono", monospace;
      background:
        radial-gradient(circle at 50% 12%, rgba(255, 224, 224, 0.23), transparent 31rem),
        radial-gradient(circle at 50% 100%, rgba(61, 7, 7, 0.24), transparent 36rem),
        var(--bg);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.18;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }

    .page {
      width: min(100% - 42px, 540px);
      padding: 26px 0 32px;
      text-align: center;
    }

    .profile { margin-bottom: 32px; }

    .avatar {
      width: 96px;
      height: 96px;
      display: block;
      object-fit: cover;
      margin: 0 auto 14px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 4px 16px rgba(34, 0, 0, 0.28);
    }

    h1 {
      margin: 0;
      color: #fff;
      font-family: "VT323", monospace;
      font-size: clamp(2rem, 8vw, 2.7rem);
      line-height: 0.9;
      letter-spacing: 0.5px;
      text-shadow: 1px 2px 0 rgba(54, 5, 5, 0.30);
    }

    .bio {
      margin: 11px 0 0;
      color: #fff;
      font-size: 0.92rem;
      letter-spacing: 0.2px;
      text-shadow: 1px 1px 0 rgba(54, 5, 5, 0.2);
    }

    .links { 
      display: grid; 
      gap: 14px; 
    }

    .link-card {
      position: relative;
      min-height: 67px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 58px;
      overflow: hidden;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: -0.3px;
      background: var(--card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .link-card:hover,
    .link-card:focus-visible {
      transform: translateY(-2px);
      background: var(--card-hover);
      box-shadow: 0 7px 18px rgba(50, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      outline: none;
    }

    .link-card:active { transform: translateY(0); }

    .link-avatar {
      position: absolute;
      left: 10px;
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 50%;
    }

    .more {
      position: absolute;
      right: 17px;
      top: 50%;
      transform: translateY(-56%);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 1px;
      color: rgba(37, 21, 25, 0.72);
    }

    .intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 16px;
      background: #000;
      opacity: 1;
      visibility: visible;
      transition: opacity 450ms ease, visibility 450ms ease;
    }

    .intro-overlay.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }


    .intro-overlay img {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center;
      background: #000;
    }

    @media (max-width: 420px) {
      .page { width: min(100% - 28px, 540px); }
      .profile { margin-bottom: 28px; }
      .link-card { min-height: 62px; font-size: 0.86rem; }
      .avatar { width: 86px; height: 86px; }
    }
  </style>
</head>

<body>
  <div class="intro-overlay" id="introOverlay" aria-hidden="true">
    <img src="img/directbygod.png" alt="" />
  </div>

  <main class="page">
    <header class="profile">
      <img class="avatar" src="img/1507104-kanye-west-wallpaper.jpg" alt="Avatar de Seu Sommelier" />
      <h1>@seusomelier</h1>
      <p class="bio">Eu bebi mas sou somelier</p>
    </header>

    <nav class="links" aria-label="Links de Seu Sommelier">
      <a class="link-card" href="mailto:eu@seusomelier.com.br">
        <img class="link-avatar" src="img/ce603a0499b07f0b52fd9d72261256eb.jpg" alt="" />
        <span>eu</span>
        <span class="more" aria-hidden="true">⋮</span>
      </a>

      <a class="link-card" href="https://www.seusomelier.com.br/eco" target="_blank" rel="noopener noreferrer">
        <img class="link-avatar" src="/img/cat.gif" alt="Ícone de ecosistema" />
        <span>ecosistema</span>
        <span class="more" aria-hidden="true">⋮</span>
      </a>

      <a class="link-card" href="https://open.spotify.com/user/21y377h4crhxufpfvftoihrtq?si=dc1ed887a9024305" target="_blank" rel="noopener noreferrer">
        <img class="link-avatar" src="img/557644443_25425894463678166_5231286458654490500_n (1).jpg" alt="" />
        <span>seusomelier 2.31.104 on Spotify</span>
        <span class="more" aria-hidden="true">⋮</span>
      </a>

      <a class="link-card" href="https://www.instagram.com/seusomelier/" target="_blank" rel="noopener noreferrer">
        <img class="link-avatar" src="img/IMG-20250424-WA0015.jpg" alt="" />
        <span>Instagram<br><small>@seusomelier</small></span>
        <span class="more" aria-hidden="true">⋮</span>
      </a>

      <a class="link-card" href="https://www.youtube.com/@seusomelier" target="_blank" rel="noopener noreferrer">
        <img class="link-avatar" src="img/channels4_profile.jpg" alt="" />
        <span>@seusomelier no YouTube</span>
        <span class="more" aria-hidden="true">⋮</span>
      </a>

      <a class="link-card" href="https://open.spotify.com/playlist/2BG7MQ4o5cB1DfPUx0K8DF?si=e6ccd882f8474e44" target="_blank" rel="noopener noreferrer">
        <img class="link-avatar" src="img/brat.png" alt="" />
        <span>white girls music<br><small>Playlist · but it's for the guys</small></span>
        <span class="more" aria-hidden="true">⋮</span>
      </a>

    </nav>
  </main>

  <script>
    const introOverlay = document.getElementById("introOverlay");
    const INTRO_DURATION = 2500;

    window.addEventListener("load", () => {
      window.setTimeout(() => {
        introOverlay.classList.add("is-hidden");
      }, INTRO_DURATION);
    });
  </script>
</body>
</html>
