<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="img/472684011_18494965459009287_7220539255364855977_n (Edit).png" type="image/x-icon">
  <title>Seu Sommelier - Ecossistema</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg: #09090b;
      --surface: rgba(24, 24, 27, 0.6);
      --surface-hover: rgba(39, 39, 42, 0.8);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(139, 92, 246, 0.3);
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --status-online: #10b981;
      --status-disc: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 0%, rgba(139, 92, 246, 0.05), transparent 30%),
        radial-gradient(circle at 85% 100%, rgba(16, 185, 129, 0.03), transparent 30%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.25rem;
    }

    .container {
      max-width: 900px;
      width: 100%;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .icon-wrapper {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: inline-block;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff, #a78bfa);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 400;
    }

    .section {
      margin-bottom: 3rem;
    }

    .section-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      color: var(--text-main);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      text-decoration: none;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card.clickable:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      transform: translateY(-3px);
      box-shadow: 0 10px 30px -10px var(--accent-glow);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .card-title {
      color: var(--text-main);
      font-weight: 600;
      font-size: 1.1rem;
    }

    .card-url {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 4px;
    }

    .card-icon {
      font-size: 1.2rem;
      opacity: 0.8;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(0,0,0,0.3);
      width: fit-content;
      margin-top: auto;
    }

    .status-badge::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
    }

    .online { color: var(--status-online); }
    .online::before { background: var(--status-online); box-shadow: 0 0 8px var(--status-online); }

    .disc { color: var(--status-disc); }
    .disc::before { background: var(--status-disc); }

    .card.discontinued {
      opacity: 0.6;
      filter: grayscale(0.8);
      pointer-events: none;
    }

    .footer {
      margin-top: auto;
      padding-top: 2rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <div class="header">
      <div class="icon-wrapper">🌐</div>
      <h1>seusomelier.com.br</h1>
      <p class="subtitle">Ecossistema</p>
    </div>

    <div class="section">
      <h2 class="section-title">Serviços Ativos</h2>
      <div class="grid" id="active-grid">
      </div>
    </div>

    <div class="section">
      <h2 class="section-title" style="color: var(--text-muted)">Descontinuados</h2>
      <div class="grid" id="disc-grid">
      </div>
    </div>

    <div class="footer">
      Sistemas internos &copy; 2024
    </div>

  </div>

  <script>
    const services = [
      { id: 'tunnel', name: 'Tunnel', url: '', icon: '🛡️', type: 'internal' },
      { id: 'www', name: 'Home', url: 'https://www.seusomelier.com.br', icon: '🏠', type: 'url' },
      { id: 'status', name: 'Status', url: 'https://status.seusomelier.com.br', icon: '📊', type: 'url' },
      { id: 'cloud', name: 'Cloud', url: 'https://cloud.seusomelier.com.br', icon: '☁️', type: 'url' },
      { id: 'reader', name: 'Reader', url: 'https://reader.seusomelier.com.br', icon: '📖', type: 'url' },
      { id: 'watch', name: 'Watch', url: 'watch.seusomelier.com.br', icon: '🎬', type: 'discontinued' },
      { id: 'yaindex', name: 'YaIndex', url: 'yaindex.seusomelier.com.br', icon: '🔍', type: 'discontinued' }
    ];

    const activeGrid = document.getElementById('active-grid');
    const discGrid = document.getElementById('disc-grid');

    function renderUI() {
      activeGrid.innerHTML = '';
      discGrid.innerHTML = '';

      services.forEach(service => {
        const isDiscontinued = service.type === 'discontinued';
        const isInternal = service.type === 'internal';
        
        let initialStatus = 'online';
        let initialText = 'Online';
        
        if (isDiscontinued) {
          initialStatus = 'disc';
          initialText = 'Descontinuado';
        } else if (isInternal) {
          initialStatus = 'online';
          initialText = 'Online (Interno)';
        }

        const CardTag = (service.url && !isDiscontinued && !isInternal) ? 'a' : 'div';
        const hrefAttr = (CardTag === 'a') ? `href="${service.url}" target="_blank"` : '';
        const clickableClass = (CardTag === 'a') ? 'clickable' : '';
        const discClass = isDiscontinued ? 'discontinued' : '';

        const displayUrl = service.url ? service.url.replace('https://', '') : 'Serviço de rede';

        const cardHTML = `
          <${CardTag} ${hrefAttr} class="card ${clickableClass} ${discClass}">
            <div class="card-header">
              <div>
                <div class="card-title">${service.name}</div>
                <div class="card-url">${displayUrl}</div>
              </div>
              <div class="card-icon">${service.icon}</div>
            </div>
            <div class="status-badge ${initialStatus}" id="status-${service.id}">
              ${initialText}
            </div>
          </${CardTag}>
        `;

        if (isDiscontinued) {
          discGrid.innerHTML += cardHTML;
        } else {
          activeGrid.innerHTML += cardHTML;
        }
      });
    }

    renderUI();
  </script>
</body>
</html>
