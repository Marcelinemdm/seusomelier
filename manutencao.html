<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="img/472684011_18494965459009287_7220539255364855977_n (Edit).png" type="image/x-icon">
  <title>Sistema em Manutenção</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap');

    :root {
      --bg: #09090b;
      --surface: rgba(24, 24, 27, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --status-online: #10b981;
      --status-offline: #ef4444;
      --status-checking: #f59e0b;
      --status-disc: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.05), transparent 25%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    .container {
      max-width: 650px;
      width: 100%;
      z-index: 1;
    }

    .window {
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                  0 0 0 1px rgba(255,255,255,0.05) inset,
                  0 0 30px var(--accent-glow);
      overflow: hidden;
    }

    .titlebar {
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls { display: flex; gap: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }

    .titlebar span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 0 auto;
      letter-spacing: 1px;
    }

    .body-content { padding: 2.5rem 2rem; text-align: center; }

    .icon-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 1.5rem;
    }

    .icon {
      font-size: 3.5rem;
      display: block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(1.8rem, 5vw, 2.2rem);
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      background: linear-gradient(to right, #fff, #a78bfa);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 2rem;
    }

    .log {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      text-align: left;
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.75rem, 2.5vw, 0.85rem);
      line-height: 2;
      overflow-x: auto;
    }

    .log-line {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed rgba(255,255,255,0.05);
      padding: 4px 0;
    }
    .log-line:last-child { border-bottom: none; }

    .log-left { display: flex; gap: 10px; align-items: center; }
    .log-time { color: #64748b; }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }

    .status-badge::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
    }

    .online { color: var(--status-online); }
    .online::before { background: var(--status-online); box-shadow: 0 0 8px var(--status-online); }
    
    .offline { color: var(--status-offline); }
    .offline::before { background: var(--status-offline); box-shadow: 0 0 8px var(--status-offline); }
    
    .checking { color: var(--status-checking); }
    .checking::before { background: var(--status-checking); animation: pulse 1s infinite; }

    .disc { color: var(--status-disc); text-decoration: line-through; }
    .disc::before { background: var(--status-disc); }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .divider {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 2rem 0;
    }

    .desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .desc strong { color: var(--text-main); }

    .footer {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
      transition: color 0.3s, text-shadow 0.3s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .footer a:hover {
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent-glow);
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="window">
      <div class="titlebar">
        <div class="controls">
          <div class="dot red"></div>
          <div class="dot yellow"></div>
          <div class="dot green"></div>
        </div>
        <span>seusomelier.com.br</span>
      </div>
      
      <div class="body-content">
        <div class="icon-wrapper">
          <span class="icon">⚙️</span>
        </div>
        <h1>MANUTENÇÃO</h1>
        <p class="subtitle">Servidor Temporariamente Offline</p>

        <div class="log" id="log-container">
        </div>

        <hr class="divider" />

        <p class="desc">
          Nossa infraestrutura está passando por atualizações.<br/>
          Esta página verifica o status em tempo real
        </p>
      </div>
    </div>

    <div class="footer">
      <a href="https://www.seusomelier.com.br">← Home</a>
      <a href="https://status.seusomelier.com.br">← Status</a>
      <a href="https://cloud.seusomelier.com.br">← Cloud</a>
      <a href="https://reader.seusomelier.com.br">← Reader</a>
    </div>
  </div>

  <script>
    const services = [
      { id: 'tunnel', name: 'cloudflare-tunnel', type: 'internal', expected: 'online' }, // Sempre online
      { id: 'www', name: 'www.seusomelier.com.br', url: 'https://www.seusomelier.com.br', type: 'url' },
      { id: 'status', name: 'status.seusomelier.com.br', url: 'https://status.seusomelier.com.br', type: 'url' },
      { id: 'cloud', name: 'cloud.seusomelier.com.br', url: 'https://cloud.seusomelier.com.br', type: 'url' },
      { id: 'reader', name: 'reader.seusomelier.com.br', url: 'https://reader.seusomelier.com.br', type: 'url' },
      { id: 'watch', name: 'watch.seusomelier.com.br', type: 'discontinued' },
      { id: 'yaindex', name: 'yaindex.seusomelier.com.br', type: 'discontinued' }
    ];

    const logContainer = document.getElementById('log-container');

    function renderLogUI() {
      logContainer.innerHTML = '';
      services.forEach(service => {
        const line = document.createElement('div');
        line.className = 'log-line';
        line.id = `log-${service.id}`;
        
        let initialStatus = 'checking';
        let initialText = 'verificando...';
        
        if (service.type === 'discontinued') {
          initialStatus = 'disc';
          initialText = 'descontinuado';
        } else if (service.type === 'internal') {
          initialStatus = 'online';
          initialText = 'online';
        }

        line.innerHTML = `
          <div class="log-left">
            <span class="log-time">[sys]</span>
            <span>${service.name}</span>
          </div>
          <div class="status-badge ${initialStatus}" id="status-${service.id}">${initialText}</div>
        `;
        logContainer.appendChild(line);
      });
    }

    function updateServiceUI(id, status, text) {
      const badge = document.getElementById(`status-${id}`);
      if(badge) {
        badge.className = `status-badge ${status}`;
        badge.innerText = text;
      }
    }

    async function checkUrlStatus(url) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 6000);
        await fetch(url, { 
          mode: 'no-cors', 
          cache: 'no-store', 
          signal: controller.signal 
        });

        clearTimeout(timeoutId);
        return true; 
      } catch (error) {
        return false;
      }
    }

    async function runChecks() {
      for (const service of services) {
        if (service.type === 'url') {
          updateServiceUI(service.id, 'checking', 'verificando...');
          
          const isOnline = await checkUrlStatus(service.url);
          
          if (isOnline) {
            updateServiceUI(service.id, 'online', 'online');
            
            // Lógica de redirecionamento
            // if (service.id === 'reader') {
            //   setTimeout(() => {
            //     window.location.href = service.url;
            //   }, 2000);
            // }
          } else {
            updateServiceUI(service.id, 'offline', 'inalcançável');
          }
        }
      }
    }

    renderLogUI();
    runChecks();
    setInterval(runChecks, 30000);

  </script>
</body>
</html>
